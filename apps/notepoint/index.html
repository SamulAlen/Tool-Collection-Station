<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识关系图谱</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- 主画布 -->
    <div id="graph-container">
        <svg id="connections-layer"></svg>
        <div id="nodes-container"></div>
    </div>

    <!-- 添加按钮 -->
    <button id="add-button">+</button>

    <!-- 创建面板 -->
    <div id="create-panel" class="panel">
        <div class="panel-header">
            <h3>创建新节点</h3>
            <button class="fullscreen-btn" id="create-fullscreen-btn" title="全屏编辑">⛶</button>
        </div>
        <input type="text" id="node-title" placeholder="节点标题" required>
        <input type="text" id="parent-search-input" placeholder="搜索父节点...">
        <select id="node-parent">
            <option value="">无父节点</option>
        </select>
        <input type="text" id="node-tag" placeholder="标签（用逗号分隔）">
        <textarea id="node-content-input" placeholder="节点内容" rows="4"></textarea>
        <div class="panel-buttons">
            <button class="primary" id="confirm-create">创建</button>
            <button class="secondary" id="cancel-create">取消</button>
        </div>
    </div>

    <!-- 编辑面板 -->
    <div id="edit-panel" class="panel">
        <div class="panel-header">
            <h3>编辑节点</h3>
            <button class="fullscreen-btn" id="edit-fullscreen-btn" title="全屏编辑">⛶</button>
        </div>
        <input type="text" id="edit-node-title" placeholder="节点标题" required>
        <input type="text" id="edit-parent-search-input" placeholder="搜索父节点...">
        <select id="edit-node-parent">
            <option value="">无父节点</option>
        </select>
        <input type="text" id="edit-node-tag" placeholder="标签（用逗号分隔）">
        <textarea id="edit-node-content-input" placeholder="节点内容" rows="4"></textarea>
        <div class="panel-buttons">
            <button class="primary" id="confirm-edit">保存</button>
            <button class="danger" id="delete-node">删除</button>
            <button class="secondary" id="cancel-edit">取消</button>
        </div>
    </div>

    <!-- 内容查看面板 -->
    <div id="view-panel">
        <h3 id="content-title"></h3>
        <p id="content-body"></p>
    </div>

    <!-- 缩放指示器 -->
    <div id="zoom-indicator">100%</div>

    <!-- 搜索框 -->
    <div id="search-box">
        <input type="text" id="search-input" placeholder="搜索节点...">
    </div>

    <!-- 控制按钮 -->
    <div id="controls">
        <button id="edit-mode-btn" title="编辑模式">✎</button>
        <button id="zoom-in-btn" title="放大">+</button>
        <button id="zoom-out-btn" title="缩小">−</button>
        <button id="reset-view-btn" title="重置视图">⟲</button>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
