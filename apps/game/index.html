<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中英文单词消消乐</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="header">
        <h1>🎮 中英文单词消消乐</h1>
        <p>点击中文单词和对应的英文单词进行配对</p>
    </div>

    <div class="game-info">
        <div class="info-box">
            分数: <span id="score">0</span>
        </div>
        <div class="info-box">
            时间: <span id="time">60</span>s
        </div>
        <div class="info-box">
            剩余: <span id="remaining">0</span>组
        </div>
    </div>

    <div class="game-container" id="gameContainer"></div>

    <div class="controls">
        <button class="btn btn-primary" id="startBtn">开始游戏</button>
        <button class="btn btn-secondary" id="resetBtn">重新开始</button>
    </div>

    <div class="message" id="message">
        <h2 id="messageTitle">游戏结束!</h2>
        <p id="messageText">你的得分: 0</p>
        <button class="btn btn-primary" id="playAgainBtn">再来一局</button>
    </div>

    <script src="js/words-data.js"></script>
    <script src="js/audio-generator.js"></script>
    <script src="js/game-logic.js"></script>
    <script src="js/ui-controller.js"></script>
</body>
</html>
